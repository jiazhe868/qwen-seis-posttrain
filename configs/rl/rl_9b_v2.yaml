# =============================================================================
# RL v2 on the 9B line (2026-11-07, README §8.3; changed 2026-11-11).
#
# Run 1 (rl9b_seed1) had almost no learning signal and a lenient report judge. In steps 1–20 the SFT policy
# solved 88% of T1, 90% of T2 and 76% of T4 groups 8/8. The judge gave 0–10 scores to rubric criteria of 47 words.
# Answers then shrank until accuracy collapsed (step 52), and only the train/rollout alarm stopped the run (step 56).
#
# v2 changes the data, the task mix, the learning rate and the stop rules:
#   - bank v2 ($DATA/v2):
#     - every v1 problem re-graded by the SFT model (8 samples, 16K, medium; dpt.data.difficulty mode audit_all);
#       8/8 is dropped and 0/8 goes to the hard pool;
#     - plus the verified hard T1 families (seismology_hard: 12 families, 3–5 steps);
#     - plus the long T1 families (seismology_long: 6 families, 6–8 steps).
#   - harder problems drawn more often: 3 / 2 / 1 copies per epoch for pass rates of at most 3/8, 5/8 and 7/8.
#   - the hard pool (0/8 for the SFT model) joins at stage B with a 10% share, scaled down below 300 problems.
#   - no T3 (reports) in training (2026-11-11). The goal is D-Num-hard and D-Fresh above SFT at 32K, and the atomic
#     report reward has not yet been checked against the independent judge. It also frees the judge's GPUs: the
#     run is one plain 8-node job (scripts/slurm/rl_v2_job.sh). Its share goes to T1.
#   - T4 at 15% (25% in run 1), and half of run 1's learning rate. Run 1 drifted after step 20, and in its steps
#     1–20 T4 was 21% of the prompts but gave a median 57% of the gradient, because T1 and T2 were nearly solved
#     (docs/reports/tech_report_en.md). Why the answers then shrank is still open.
#   - a dev pass and a checkpoint every 10 steps. A pause when dev D-Num falls 3 points below its best, or when the
#     share of T1 dev answers with a wrong value rises 3 points above its lowest.
# Unchanged from run 1: the SFT start, 126 prompts × 8, the losses, and by default the 16K cap. rl_v2_job.sh
# switches to 24K with a frozen MTP head when a one-step memory test at full length passes.
#
# Changed on 2026-11-15, before any seed started (the user: the target is a large gain on what the model cannot do
# yet, not 90% → 95% on a saturated set; D-Num is saturated, so lower its weight and raise the weight and the
# diversity of the harder problems):
#   - the re-grade runs at 24K (configs/data/pipeline.yaml), so problems solved only past 16K count as solvable;
#   - mix T1 70 / T2 15 / T4 15 (T2 25% before: T2 is not re-graded, and 90% of run 1's T2 groups were 8/8);
#   - steeper difficulty copies: 4 / 3 / 2 / 1 for pass rates up to 2/8, 4/8, 6/8 and 7/8;
#   - the 12 hard and 6 long families drawn twice as often, and no family above 6% of its pool (family_weights);
#   - the hard pool (0/8 at 24K) from step 20 with a 20% share;
#   - a second dev split, 10 held-out problems of each hard and long family (rl_dev_hard), with its own pause
#     rules: its accuracy, its wrong values, its unfinished answers that already hold the right value, its length.
#     Run 1's pinned dev split held almost only easy problems and saw the trade of unfinished for wrong answers late.
#   - changed again that night, after a replay of the first step on the pilot's answers (the user's decision): a T1
#     answer that runs out of tokens counts as wrong (score 0, kept in its group), and there is no soft length
#     penalty. Under the old rule (cut-off answers left out, answers ending between 20K and 24K docked by up to
#     0.5), 11 of the 24 groups with gradient had it only because a long right answer was docked, and a right
#     answer at 23.5K got an advantage of -0.31 while a cut-off answer got 0. In the pilot's first 50 problems, all
#     25 right answers that finished past 16K had written the value by token 16,384, and 38 of the 105 answers with
#     an early value were still checking at 24K: the model has the value and does not stop. The full pilot (180
#     problems, README §8.3): 29% of all groups with gradient from the penalty alone; 175 of 175 late right answers
#     with the value before 16K; 359 of the 794 answers with an early value still checking at 24K.
#   - seed 3 differs only in its budget, 16K (rl_9b_v2_seed3.yaml).
# =============================================================================
defaults_from: rl_9b.yaml
requires_model_line: qwen35_9b

project:
  thinking:
    rl_overlong_max_penalty: 0.0          # no soft length penalty (2026-11-15, see the header)

rl:
  sampling:
    truncated_as_wrong_tasks: [t1_num]    # a cut-off T1 answer scores 0 and stays in its group (dpt.rl.filtering)
  # Run 1 used 2e-6 → 1e-6. Its dev D-Num peaked at step 20 (97.3) and fell to 78.9 by step 40. The 27B's rule
  # (A8: 2e-6 made it oscillate) gave 1e-6 → 5e-7, the values used here.
  lr_schedule: {base_lr: 1.0e-6, final_lr: 5.0e-7, final_phase_steps: 34}

curriculum:
  # Run 1's stage boundaries, one mix for all three stages. The stages still set the hard pool's join step and
  # the final LR phase.
  stages:
    - {name: A_verifiable_warmup, start: 0, end: 34, mix: {t1_num: 0.70, t2_code: 0.15, t3_report: 0.00, t4_general: 0.15}}
    - {name: B_add_hard_pool, start: 34, end: 86, mix: {t1_num: 0.70, t2_code: 0.15, t3_report: 0.00, t4_general: 0.15}}
    - {name: C_consolidate, start: 86, end: 120, mix: {t1_num: 0.70, t2_code: 0.15, t3_report: 0.00, t4_general: 0.15}}
  # 0/8 at 24K gives a group of 8 a mixed result only when the policy has improved, so the hard pool still waits,
  # but 20 steps instead of 34, and a 20% share instead of 10% (scaled down below 300 problems).
  hard_pool_join_step: 20
  hard_share: 0.20
  hard_pool_min_size: 300
  # Copies per epoch by pass rate: 4 / 3 / 2 / 1 up to 2/8, 4/8, 6/8 and 7/8. Since the 16K re-grade (2026-11-15)
  # the bank also keeps problems solved 8/8 at 24K but slowly, for seed 3; at 24K they would teach nothing, so they
  # get 0 copies here. A rate of exactly 0 (none right within 16K, some within 24K) gets 1 copy.
  difficulty_weights: {enabled: true, bands: [[0.0, 1], [0.25, 4], [0.5, 3], [0.75, 2], [0.875, 1], [1.0, 0]], unknown: 1}
  # bank v2's hard (3–5 steps) and long (6–8 steps) T1 families, drawn twice as often; no family above 6% of its
  # pool (bank v1 had 39 T1 families at ~3% each). The map comes from bank_merge carve-hard-dev (rl_v2_job.sh).
  family_weights:
    copies: 2
    max_share: 0.06
    families:
      # hard (12)
      - epicentre_from_three_sp
      - array_backazimuth
      - array_apparent_velocity
      - three_layer_head_wave_time
      - second_layer_thickness_from_intercepts
      - dipping_refractor_velocity
      - dipping_refractor_dip
      - gr_count_from_magnitude_sample
      - poisson_ratio_from_wadati_fit
      - second_interface_reflected_energy
      - q_from_spectral_ratio
      - depth_from_pp_delay
      # long (6)
      - locate_then_local_magnitude
      - wadati_origin_then_depth
      - refraction_then_reflection_time
      - fault_slip_stress_energy
      - attenuation_then_amplitude
      - great_circle_origin_time
  family_map: ${rl_run.data_dir}/uid_family.json
  # When T1 saturates during the run (zero-advantage groups above 60% for 30 steps while dev stalls), raise the hard
  # pool's share (+0.10 per trigger, up to 0.50) and keep T1's weight: cutting it would move prompts to code and
  # general tasks, which are even more saturated (2026-11-15, the review of the redesign).
  auto_reweight:
    weight_factor: 1.0
    max_hard_share: 0.50

rl_run:
  run_name: rl${project.model.tag}_v2_seed${project.seed}
  # The SFT export from its copy on $WORK. The $SCRATCH original (same files) was last read on 10-29, and the site
  # purges $SCRATCH files left unread for 10 days (checked 2026-11-09).
  init_checkpoint: ${oc.env:WORK,.}/dpt/exports/sft${project.model.tag}_seed${rl_run.sft_seed}
  data_dir: ${project.paths.data_root}/v2
  # rl_main and rl_hard without the problems held out for rl_dev_hard (bank_merge carve-hard-dev)
  train_files: ["${rl_run.data_dir}/rl_main_train.parquet", "${rl_run.data_dir}/rl_hard_train.parquet"]
  # The dev split without its T3 rows (python -m dpt.data.bank_merge without-task). With no judge in this job,
  # T3 rows would score 0 at every dev pass and only cost generation time. Then the hard dev split (2026-11-15).
  dev_files: ["${rl_run.data_dir}/rl_dev_no_t3.parquet", "${rl_run.data_dir}/rl_dev_hard.parquet"]
  hard_dev_per_family: 10                   # 18 families × 10 = 180 problems; read by rl_v2_job.sh
  dev_freq: 10
  # Every dev pass has a checkpoint to select: 12 × ~126 GB on $SCRATCH.
  save_freq: 10

monitoring:
  gold_eval_every: 10
  extra_rules:
    - name: dev_d_num_best_drop
      kind: best_drop
      metric: dev/d_num
      max_drop: 3.0
      action: pause
      risk: "the policy is getting worse on dev (run 1: 97.3 at step 20, 78.9 at step 40; stopped only at step 56)"
    - name: dev_t1_wrong_value_rise
      kind: best_drop
      better: low
      metric: dev/t1_wrong_value
      max_drop: 3.0
      action: pause
      risk: "finished answers with wrong values are replacing unfinished ones (run 1's T1 dev answers: 1.8% wrong
        values at step 20, 17.8% at step 40). At the 32K eval budget many unfinished answers would have been right"
    - name: t1_length_drop
      kind: relative_change
      metric: task/t1_num/len_mean
      window: 30
      drop_frac: 0.6
      action: warn
      risk: "T1 answers shrinking fast, as before run 1's collapse; a warning only, since shorter answers are also
        the efficiency RL is for"
    # The hard dev split (2026-11-15): 180 problems × 4 answers per pass (val_kwargs.n 4; run 1's dev dump held 190
    # prompts × 4). On the same problems a score moves ~1.3 points between passes by sampling alone, and a best so
    # far sits ~2 points above its mean. The thresholds sit well above that.
    - name: dev_t1_hard_best_drop
      kind: best_drop
      metric: dev/t1_hard
      max_drop: 10.0
      action: pause
      risk: "the policy is getting worse on the hard and long families, the ones this run is for"
    - name: dev_t1_hard_wrong_value_rise
      kind: best_drop
      better: low
      metric: dev/t1_hard_wrong_value
      max_drop: 10.0
      action: pause
      risk: "on hard problems, finished wrong answers are replacing unfinished ones (run 1 on D-Num-hard at 32K:
        unfinished 28.2% → 16.5%, wrong values 3.6% → 12.6%)"
    - name: dev_t1_hard_unfinished_seen_rise
      kind: best_drop
      better: low
      metric: dev/t1_hard_unfinished_seen
      max_drop: 12.0
      action: pause
      risk: "more hard answers hold the right value and never answer: the model checks instead of committing"
    # Hard answers are meant to get shorter (2026-11-15, fourth review): the SFT model writes the value early and then
    # checks (full pilot: right answers past 16K have it by token 3,130 and end near 20,600; median answer 24K), and a
    # cut-off answer now counts as wrong. Halving alone is therefore a warning; it pauses only with a loss of 5 points
    # (dev passes give 180 problems × 4 answers: ~1.4 points of noise per pass, ~2 more for a best-so-far), or when
    # answers fall below 2,500 tokens, the kind of fall run 1 made (T1 answers 3,071 → 548 → 17 tokens).
    - name: dev_t1_hard_length_halved
      kind: relative_change
      metric: dev/t1_hard_len
      window: 30
      min_history: 3                         # dev passes come every 10 steps
      drop_frac: 0.5
      action: warn
      risk: "hard answers halved in length within 30 steps: the intended effect if accuracy holds"
    - name: dev_t1_hard_length_drop
      kind: harmful_drop
      metric: dev/t1_hard_len
      window: 30
      min_history: 3
      drop_frac: 0.5
      harm:
        - {metric: dev/t1_hard, min_delta: 5.0}
        - {metric: dev/t1_hard_wrong_value, better: low, min_delta: 5.0}
      action: pause
      risk: "hard answers halved in length while accuracy fell or wrong values rose; run 1's T1 answers fell from
        3,071 to 548 tokens while dev D-Num fell from 97.3 to 78.9"
    - name: dev_t1_hard_length_floor
      kind: threshold
      metric: dev/t1_hard_len
      below: {pause: 2500}
      action: pause
      risk: "hard answers average under 2,500 tokens; the SFT model needs 6-24K on these families"

# =============================================================================
# Stage 1: full-parameter SFT of Qwen3.8-27B on the domain mix (report §阶段一).
#
#   bash scripts/04_sft.sh                       # cluster profile, 16 GPUs
#   DPT_DRY_RUN=1 bash scripts/04_sft.sh         # print the rendered command only
#
# Decisions (with the evidence that settled them):
#   * SFT only, no CPT. A 2B-token CPT ablation cost 720 GPU·h, gained +1.1
#     D-Num (inside the ±1.6 CI) and lost 1.3 more general points.
#   * 2 epochs, not 3. Three epochs scored marginally higher right after SFT,
#     but token entropy fell 24% below base (2 epochs: 15%) and the RL run
#     plateaued earlier. SFT must leave exploration headroom for RL.
#   * 25% self-distilled general replay (generated by the base model itself)
#     keeps format, tone and tool-call habits. It cut general regression from
#     -3.2 to -1.1.
#   * Same parallel layout as RL (TP4×PP2×DP2), so memory/throughput behaviour
#     is known before RL starts.
# =============================================================================
sft:
  run_name: sft27b_seed${project.seed}
  base_model: ${project.model.base}
  # = data_pipeline.output_dir/sft (sft stage). JSONL is read directly by DPTSFTDataset.
  train_files: ["${project.paths.data_root}/v1/sft/sft_train.jsonl"]
  # No SFT validation loss: the SFT checkpoint is chosen by the RL-entry gate on real evals
  # (domain > base, general Δ ≥ -1.5, pass@16 ≥ base), not by held-out loss.
  val_files: null
  epochs: 2
  global_batch_conversations: 128      # ≈ 2M tokens per step at the mix's mean length
  max_length: ${project.thinking.max_context}
  lr_peak: 8.0e-6
  lr_warmup_steps: 50
  lr_min_ratio: 0.1                    # cosine to 10% of peak
  weight_decay: 0.1
  adam_beta2: 0.95
  grad_clip: 1.0
  mtp_loss_weight: 0.1                 # keep the MTP head matched → usable as a rollout draft model later
  frozen_prefixes: ["model.visual."]   # vision tower: restored from base on export (see dpt.launch.checkpoint_tools)
  output_dir: ${project.paths.ckpt_root}/sft/${sft.run_name}

# Hydra overrides for `torchrun -m verl.trainer.sft_trainer`, rendered by dpt.launch.sft.
# Keys verified against verl 0.9.1 (see docs/verl_integration.md).
verl_sft:
  engine: megatron                     # Hydra group selection (engine@engine)
  optim: megatron                      # Hydra group selection (optim@optim)
  model.path: ${sft.base_model}
  model.trust_remote_code: false
  model.mtp.enable: true
  model.mtp.enable_train: true
  model.mtp.mtp_loss_scaling_factor: ${sft.mtp_loss_weight}
  # --- data: our dataset class renders each row with its own reasoning effort -------------------
  data.train_files: ${sft.train_files}
  data.val_files: ${sft.val_files}           # null: no validation set (and test_freq must then be -1)
  data.custom_cls.path: ${oc.env:DPT_REPO,.}/src/dpt/verl_ext/sft_dataset.py
  data.custom_cls.name: DPTSFTDataset
  data.train_batch_size: ${sft.global_batch_conversations}
  # Micro-batch = ONE conversation (≤ 32K tokens): activation memory is then bounded by the
  # longest sample, which is what the per-GPU memory plan assumes (README §6.3).
  data.micro_batch_size_per_gpu: 1
  data.use_dynamic_bsz: false
  data.max_length: ${sft.max_length}
  data.truncation: error                 # never truncate reasoning traces; the builder drops oversize rows
  # Dataset output format only (unpadded tensors); the *engine* decides the layout below.
  data.pad_mode: no_padding
  # --- parallelism (one full model copy per node; only DP traffic crosses IB) ---------------------
  engine.tensor_model_parallel_size: ${hardware.train.tp}
  engine.pipeline_model_parallel_size: ${hardware.train.pp}
  engine.context_parallel_size: ${hardware.train.cp}
  engine.sequence_parallel: ${hardware.train.sequence_parallel}
  engine.use_mbridge: true
  # Megatron's Gated DeltaNet path does not support packed (THD) sequences: GDN state would leak
  # across sample boundaries. Use the padded BSHD layout. With one sample per micro-batch, padding
  # is only TP/SP alignment, not padding to the longest sample in the batch.
  engine.use_remove_padding: false
  engine.pad_bshd_to_minibatch_max: false
  engine.override_transformer_config.recompute_granularity: full
  engine.override_transformer_config.recompute_method: uniform
  engine.override_transformer_config.recompute_num_layers: 1
  +engine.override_transformer_config.gradient_accumulation_fusion: ${hardware.train.gradient_accumulation_fusion}
  # --- optimizer -----------------------------------------------------------------------------
  optim.lr: ${sft.lr_peak}
  optim.lr_warmup_steps: ${sft.lr_warmup_steps}
  optim.lr_decay_style: cosine
  optim.min_lr: 8.0e-7                   # absolute on Megatron (= lr_min_ratio × lr_peak); keep in sync
  optim.weight_decay: ${sft.weight_decay}
  optim.betas: [0.9, "${sft.adam_beta2}"]
  # verl 0.9.1 does not pass optim.betas on to Megatron's optimizer, whose default beta2 is 0.999 (found
  # 2026-10-28, before the first SFT step on either line). Set the recipe's values on Megatron directly.
  +optim.override_optimizer_config.adam_beta1: 0.9
  +optim.override_optimizer_config.adam_beta2: ${sft.adam_beta2}
  optim.clip_grad: ${sft.grad_clip}
  optim.use_checkpoint_opt_param_scheduler: true   # resume continues the cosine schedule exactly
  # --- trainer -------------------------------------------------------------------------------
  trainer.project_name: ${project.name}
  trainer.experiment_name: ${sft.run_name}
  trainer.default_local_dir: ${sft.output_dir}
  trainer.total_epochs: ${sft.epochs}
  trainer.save_freq: 100
  # verl 0.9.1 validates whenever test_freq > 0, with or without a validation set; with none it crashed the
  # 9B SFT at step 50 (2026-10-29). -1 = never.
  trainer.test_freq: -1
  trainer.seed: ${project.seed}
  trainer.resume_mode: auto
  trainer.logger: [console, wandb]
  trainer.nnodes: ${hardware.nnodes}
  trainer.n_gpus_per_node: ${hardware.gpus_per_node}

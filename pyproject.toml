[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpt"
version = "0.1.0"
description = "Domain post-training (SFT + multi-task GRPO) for Qwen3.8-27B on verl + Megatron-Core + vLLM"
readme = "README.md"
requires-python = ">=3.10"
# Core deps are deliberately small: everything under src/dpt that is *not* in
# dpt/rl/verl_ext or dpt/parity runs on a laptop CPU with only these installed.
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "omegaconf>=2.3",
  "httpx>=0.27",
  "regex>=2023.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Data pipeline extras (parquet I/O for verl, tokenizer for length stats).
data = ["pandas>=2.0", "pyarrow>=15", "transformers>=5.0"]
# Training stack. Versions are pinned per hardware profile in requirements/*.txt;
# the ranges here only document compatibility intent.
train = ["torch>=2.6", "verl==0.9.1", "vllm>=0.17", "ray>=2.40", "transformers>=5.0"]
# Evaluation extras (scipy for exact binomial / bootstrap helpers).
eval = ["scipy>=1.10", "pandas>=2.0", "sympy>=1.12"]
dev = ["pytest>=8", "pytest-cov>=5", "flake8>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: needs at least one CUDA GPU (skipped automatically when none is visible)",
  "network: needs outbound network (skipped by default; run with -m network)",
  "slow: takes more than ~10 s on CPU",
]

[tool.flake8]
max-line-length = 120
